<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 Job Matching Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    .content {
      padding: 40px 30px;
    }
    .form-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 0.95em;
    }
    textarea, input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-search {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-search:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-clear {
      background: #f0f0f0;
      color: #333;
    }
    .btn-clear:hover {
      background: #e0e0e0;
    }
    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid #c33;
    }
    .results {
      display: none;
    }
    .results-header {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #eee;
    }
    .results-header h2 {
      color: #333;
      margin-bottom: 8px;
    }
    .results-header p {
      color: #666;
      font-size: 0.95em;
    }
    .job-item {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
      transition: all 0.3s;
    }
    .job-item:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transform: translateX(5px);
    }
    .job-title {
      font-size: 1.15em;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }
    .job-title a {
      color: #667eea;
      text-decoration: none;
    }
    .job-title a:hover {
      text-decoration: underline;
    }
    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 12px;
      font-size: 0.9em;
      color: #666;
    }
    .match-score {
      display: inline-block;
      padding: 4px 12px;
      background: #667eea;
      color: white;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9em;
    }
    .match-score.high {
      background: #10b981;
    }
    .match-score.medium {
      background: #f59e0b;
    }
    .job-description {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .job-skills {
      margin-bottom: 12px;
    }
    .skills-label {
      font-weight: 600;
      color: #333;
      font-size: 0.85em;
      margin-bottom: 5px;
    }
    .skill-tag {
      display: inline-block;
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85em;
      margin-right: 6px;
      margin-bottom: 4px;
    }
    .job-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85em;
      color: #999;
      flex-wrap: wrap;
    }
    .apply-btn {
      background: #667eea;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s;
    }
    .apply-btn:hover {
      background: #764ba2;
    }
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    @media (max-width: 600px) {
      .container { margin: 10px; border-radius: 8px; }
      .header h1 { font-size: 1.8em; }
      .content { padding: 20px; }
      .button-group { flex-direction: column; }
      .job-meta { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Job Matching Agent</h1>
      <p>Find jobs that match YOUR profile</p>
    </div>
    
    <div class="content">
      <form id="searchForm">
        <div class="form-group">
          <label for="resume">📄 Your Resume (Plain Text)</label>
          <textarea id="resume" placeholder="Paste your resume or career summary here..." required></textarea>
        </div>
        
        <div class="form-group">
          <label for="jobTitles">🎯 Target Job Titles (comma-separated)</label>
          <input type="text" id="jobTitles" placeholder="e.g., Data Analyst, Finance Analyst, Tax Consultant" required>
        </div>
        
        <div class="form-group">
          <label for="locations">📍 Preferred Locations (comma-separated)</label>
          <input type="text" id="locations" placeholder="e.g., Remote, Dubai, Switzerland, New York" required>
        </div>
        
        <div class="form-group">
          <label for="experience">📅 Years of Experience</label>
          <input type="text" id="experience" placeholder="e.g., 2 or 2-4" value="2" required>
        </div>
        
        <div class="form-group">
          <label for="jobType">💼 Job Type</label>
          <select id="jobType">
            <option value="all">All</option>
            <option value="Full-time">Full-time</option>
            <option value="Contract">Contract</option>
            <option value="Remote">Remote</option>
          </select>
        </div>
        
        <div class="button-group">
          <button type="submit" class="btn-search">🔍 Find Jobs</button>
          <button type="reset" class="btn-clear">🔄 Clear</button>
        </div>
      </form>
      
      <div class="error" id="error"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #667eea;">Searching jobs and analyzing matches...</p>
      </div>
      
      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const resume = document.getElementById('resume').value.trim();
      const jobTitles = document.getElementById('jobTitles').value.split(',').map(x => x.trim());
      const locations = document.getElementById('locations').value.split(',').map(x => x.trim());
      const experience = document.getElementById('experience').value.trim();
      const jobType = document.getElementById('jobType').value;
      
      if (!resume) {
        showError('Please paste your resume');
        return;
      }
      
      if (!jobTitles) {
        showError('Please enter job titles');
        return;
      }
      
      if (!locations) {
        showError('Please enter locations');
        return;
      }
      
      document.getElementById('error').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.querySelector('.btn-search').disabled = true;
      
      try {
        const response = await fetch('/api/search-jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resume,
            job_titles: jobTitles,
            locations,
            experience,
            job_type: jobType
          })
        });
        
        if (!response.ok) {
          throw new Error('Server error. Please try again.');
        }
        
        const data = await response.json();
        displayResults(data.jobs || []);
        
      } catch (error) {
        showError(error.message || 'An error occurred. Please try again.');
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.querySelector('.btn-search').disabled = false;
      }
    });
    
    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '❌ ' + message;
      errorDiv.style.display = 'block';
    }
    
    function displayResults(jobs) {
      const resultsDiv = document.getElementById('results');
      
      if (!jobs || jobs.length === 0) {
        resultsDiv.innerHTML = '<div class="no-results">No matching jobs found. Try different search criteria!</div>';
        resultsDiv.style.display = 'block';
        return;
      }
      
      const resultsHTML = `
        <div class="results-header">
          <h2>✅ Found ${jobs.length} Matching Jobs</h2>
          <p>Sorted by match score. Click "Apply" to go to job posting.</p>
        </div>
        ${jobs.map((job, idx) => `
          <div class="job-item">
            <div class="job-title">
              ${idx + 1}. <a href="${job.url || '#'}" target="_blank">${job.title || 'Job Title'}</a>
            </div>
            <div class="job-meta">
              <div><strong>${job.company || 'Company'}</strong></div>
              <div>📍 ${job.location || 'Location'}</div>
              <span class="match-score ${getScoreClass(job.match_score)}">
                ⭐ ${job.match_score || 0}% Match
              </span>
            </div>
            <div class="job-description">${job.description || 'No description available'}</div>
            ${job.matched_skills && job.matched_skills.length > 0 ? `
              <div class="job-skills">
                <div class="skills-label">🎯 Your Skills Found:</div>
                ${job.matched_skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
              </div>
            ` : ''}
            <div class="job-footer">
              <span>
                <strong>Type:</strong> ${job.job_type || 'N/A'} | <strong>Posted:</strong> ${job.posted_date || 'N/A'}<br>
                <strong>Source:</strong> ${job.source || 'N/A'} | <strong>Salary:</strong> ${job.salary || 'Not specified'}
              </span>
              <a href="${job.url || '#'}" target="_blank" class="apply-btn">Apply →</a>
            </div>
          </div>
        `).join('')}
      `;
      
      resultsDiv.innerHTML = resultsHTML;
      resultsDiv.style.display = 'block';
    }
    
    function getScoreClass(score) {
      if (score >= 70) return 'high';
      if (score >= 50) return 'medium';
      return '';
    }
  </script>
</body>
</html>
